# Makes the Hugging Face dataset and demo Space public (run once, after Malav approved them).
name: Make Hugging Face pages public
on: workflow_dispatch
jobs:
  public:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - run: pip install -q huggingface_hub
      - shell: python
        run: |
          from huggingface_hub import HfApi
          api = HfApi()
          for r, t in [("Malavnaik/eu-dsa-articles", "dataset"), ("Malavnaik/ask-the-dsa", "space")]:
              api.update_repo_settings(r, repo_type=t, private=False)
              print(r, "private =", api.repo_info(r, repo_type=t).private)
